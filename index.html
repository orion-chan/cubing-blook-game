<div class="sidebar">
  <h2>Cubelet API</h2>
  <button onclick="switchTab('market')">🛒 Market</button>
  <button onclick="switchTab('blocks')">🎒 Blooks</button>
  <button onclick="switchTab('stats')">👤 Stats</button>
</div>

<div class="main-content">
  <div class="top-bar">
    <div class="user-avatar" id="global-avatar">🎲</div>
    <div class="token-counter">🪙 <span id="user-tokens">500</span></div>
  </div>

  <div class="page-body">
    <div id="market-screen" class="page active">
      <h1>Booster Market</h1>
      <button onclick="purchaseBox('wca')">🧱 WCA Box (25 🪙)</button>
      <button onclick="purchaseBox('mod')">🔮 Mod Box (40 🪙)</button>
    </div>

    <div id="blocks-screen" class="page" style="display:none;">
      <h1>My Blooks</h1>
      <div id="blook-render-grid"></div>
    </div>

    <div id="stats-screen" class="page" style="display:none;">
      <h1>Account Stats</h1>
      <p>Boxes Opened: <span id="stat-opened">0</span></p>
    </div>
  </div>
</div>

<div id="reward-popup" style="display:none; position:fixed; top:30%; left:40%; background:white; padding:30px; border:5px solid black; text-align:center;">
  <h2>Box Opened!</h2>
  <h1 id="popup-art">❓</h1>
  <h3 id="popup-name">Item</h3>
  <button onclick="document.getElementById('reward-popup').style.display='none'">Awesome!</button>
</div>
