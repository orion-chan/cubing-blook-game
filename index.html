<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube Packs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <h1>Cubing Blook Opener</h1>
        <div class="stats">Tokens: <span id="token-count">100</span></div>
        
        <div class="pack-card">
            <h3>WCA Starter Pack</h3>
            <p>Cost: 20 Tokens</p>
            <button id="open-button">Open Pack</button>
        </div>

        <div class="result-display">
            <h2>You Got:</h2>
            <div id="blook-name">Click open to start!</div>
            <div id="blook-rarity"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
